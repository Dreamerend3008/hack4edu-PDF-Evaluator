<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Evaluador IA de PDF</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Alpine.js -->
  <script src="//unpkg.com/alpinejs" defer></script>
  
  <style>
    @font-face {
      font-family: 'CaskaydiaMono';
      src: url('../../../public/fonts/CaskaydiaMonoNerdFontMono-Regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
    }
    
    body {
      font-family: 'CaskaydiaMono', monospace;
      background-color: #20232a;
    }
    
    .fade-in {
      animation: fadeIn 0.5s ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .progress-bar {
      height: 6px;
      background: linear-gradient(90deg, #638ce3, #1d6489);
      border-radius: 3px;
      transition: width 0.3s ease;
    }
    .container-box {
      background-color: #1d2e33;
      border-color: #1b3847;
    }
    .accent-circle {
      background-color: #638ce3;
    }
    .btn-upload {
      background: linear-gradient(135deg, #638ce3 0%, #1d6489 100%);
    }
    .btn-upload:hover {
      background: linear-gradient(135deg, #7a9ee8 0%, #2a7ba3 100%);
    }
    .upload-area {
      background-color: #1b3847;
      border-color: #1d6489;
    }
    .upload-area:hover {
      background-color: #1d2e33;
    }
  </style>
</head>
<body class="text-white font-mono min-h-screen flex flex-col items-center justify-center p-4">
  <div class="max-w-2xl w-full">
    <!-- Encabezado -->
    <div class="text-center mb-8 fade-in">
      <h1 class="text-3xl font-bold mb-2" style="color: #d5d2c9;">Recuerda que tiene que estar en formato PDF</h1>
    </div>

    <!-- Contenedor principal -->
    <div x-data="pdfUploader()" class="container-box backdrop-blur-sm rounded-2xl shadow-2xl overflow-hidden fade-in border">
      <!-- Área de carga -->
      <div class="p-8 border-b" style="border-color: #1b3847;">
        <div class="flex flex-col items-center justify-center mb-6">
          <div class="w-16 h-16 accent-circle rounded-full flex items-center justify-center mb-4">
            <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
            </svg>
          </div>
          <h2 class="text-xl font-semibold" style="color: #d5d2c9;">Subir archivo PDF</h2>
        </div>

        <!-- Selector de archivos -->
        <div class="mb-6">
          <label class="block text-sm font-medium mb-2" style="color: #d5d2c9; opacity: 0.9;">Selecciona un archivo PDF</label>
          <div class="flex items-center justify-center w-full">
            <label class="upload-area flex flex-col items-center justify-center w-full h-32 border-2 border-dashed rounded-lg cursor-pointer transition">
              <div class="flex flex-col items-center justify-center pt-5 pb-6" x-show="!file">
                <svg class="w-8 h-8 mb-3" style="color: #d5d2c9; opacity: 0.7;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                </svg>
                <p class="mb-2 text-sm" style="color: #d5d2c9;"><span class="font-semibold">Haz clic para subir</span></p>
                <p class="text-xs" style="color: #d5d2c9; opacity: 0.7;">PDF (Máx. 10MB)</p>
              </div>
              <div x-show="file" class="text-center">
                <svg class="w-8 h-8 mx-auto mb-2" style="color: #326342;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                <p class="text-sm font-medium" style="color: #d5d2c9;" x-text="file.name"></p>
                <p class="text-xs" style="color: #d5d2c9; opacity: 0.7;" x-text="formatFileSize(file.size)"></p>
              </div>
              <input type="file" @change="handleFile" accept="application/pdf" class="hidden" />
            </label>
          </div>

          <!-- Botón de prueba de fetch -->
          <div class="mt-6 text-center">
            <button
              @click="testFetch"
              class="px-6 py-3 rounded-lg text-lg font-semibold transition"
              style="background: linear-gradient(135deg, #638ce3 0%, #1d6489 100%); color: #d5d2c9;"
            >
              testFetch
            </button>
          </div>


        </div>

        <!-- Barra de progreso -->
        <div x-show="uploading" class="mb-6">
          <div class="flex justify-between text-sm mb-1" style="color: #d5d2c9;">
            <span>Subiendo archivo...</span>
            <span x-text="uploadProgress + '%'"></span>
          </div>
          <div class="w-full rounded-full h-2" style="background-color: #1b3847;">
            <div class="progress-bar h-2 rounded-full" :style="`width: ${uploadProgress}%`"></div>
          </div>
        </div>

        <!-- Botón de subida -->
        <button
          @click="upload"
          :disabled="!file || uploading"
          :class="!file || uploading ? 'opacity-50 cursor-not-allowed' : 'transform hover:scale-105'"
          class="btn-upload w-full py-3 px-4 font-semibold rounded-lg shadow-md transition-all duration-300 flex items-center justify-center"
        >
          <span x-show="!uploading">Evaluar PDF</span>
          <span x-show="uploading" class="flex items-center">
            <svg class="animate-spin -ml-1 mr-3 h-5 w-5" style="color: #d5d2c9;" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            Procesando...
          </span>
        </button>

        <!-- Mensaje de error -->
        <div x-show="error" class="mt-4 p-3 rounded-lg flex items-start" style="background-color: rgba(91, 0, 9, 0.5); border: 1px solid #5b0009;">
          <svg class="w-5 h-5 mt-0.5 mr-2 flex-shrink-0" style="color: #e3b063;" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"></path>
          </svg>
          <span class="text-sm" style="color: #d5d2c9;" x-text="error"></span>
        </div>
      </div>

      <!-- Resultados -->
      <div x-show="response" class="p-6" style="background-color: #1d2e33;">
        <h3 class="text-lg font-semibold mb-4 flex items-center" style="color: #d5d2c9;">
          <svg class="w-5 h-5 mr-2" style="color: #638ce3;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
          </svg>
          Resultado de la evaluación
        </h3>
        <div class="rounded-lg p-4 max-h-96 overflow-y-auto" style="background-color: #1b3847; border: 1px solid #1d6489;">
          <pre class="text-sm whitespace-pre-wrap" style="color: #d5d2c9;" x-text="response"></pre>
        </div>
        
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('alpine:init', () => {
      Alpine.data('pdfUploader', () => ({
        file: null,
        response: '',
        error: '',
        uploading: false,
        uploadProgress: 0,

        handleFile(event) {
          this.file = event.target.files[0];
          this.error = '';
          this.response = '';
        },

        formatFileSize(bytes) {
          if (bytes === 0) return '0 Bytes';
          const k = 1024;
          const sizes = ['Bytes', 'KB', 'MB', 'GB'];
          const i = Math.floor(Math.log(bytes) / Math.log(k));
          return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        },

        async upload() {
          if (!this.file) {
            this.error = 'Selecciona un archivo PDF primero.';
            return;
          }

          // Validar tipo de archivo
          if (this.file.type !== 'application/pdf') {
            this.error = 'Por favor, selecciona un archivo PDF válido.';
            return;
          }

          this.uploading = true;
          this.uploadProgress = 0;
          this.error = '';
          this.response = '';

          // Simular progreso de carga
          const progressInterval = setInterval(() => {
            if (this.uploadProgress < 90) {
              this.uploadProgress += 10;
            }
          }, 200);

          const formData = new FormData();
          formData.append('file', this.file);
          formData.append('blob_name', this.file.name);          // nombre del blob en Azure
          formData.append('student_id', '666');           // ID del estudiante
          formData.append('student_name', 'Satanas');    // nombre del estudiante
          formData.append('workshop_id', '2');   // ID del taller o actividad


          //Fetch para upload pdf
          const URL = 'https://fahack4edu-b7cfhhbtczb0gndq.westus3-01.azurewebsites.net/api/uploadPDF'
          
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 100000); // 100
          
          //Manejo de res
          
          
          //Subida de pdf
          try {
            const res = await fetch(URL, {
              method: 'POST',
              body: formData,
              signal: controller.signal
            });

            const info = {
              url: URL,
              status: res.status,
              statusText: res.statusText,
              contentType: res.headers.get('content-type') || ''
            };
            clearTimeout(timeoutId);

            this.uploadProgress = 100;

            if (!res.ok) {
              // intenta obtener cuerpo para ver mensaje de error del servidor
              let textBody = '';
              try {
                textBody = await res.text();
              } catch (e) {
                textBody = '<no se pudo leer el body de error>';
              }
              this.response = JSON.stringify({ info, body: textBody }, null, 2);
              this.error = `Respuesta no OK: ${res.status} ${res.statusText}`;
              return;
            }

            // Si es JSON, parsea; si no, devuelve texto
            const ct = res.headers.get('content-type') || '';
            if (ct.includes('application/json')) {
              const data = await res.json();
              
              // Guardar en localStorage y redirigir a evaluacion.html
              localStorage.setItem('evaluationResult', JSON.stringify(data));
              window.location.href = 'Evaluacion.html';
              
            } else {
              const text = await res.text();
              this.response = JSON.stringify({ info, text }, null, 2);
            }

          } catch (error) {
            this.error = `Error: ${error.message}`;
          } finally {
            this.uploading = false;
            this.uploadProgress = 0;
          }
        },

        async testFetch() {
          this.error = '';
          this.response = 'Realizando prueba de conexión...';

          const url = 'https://fahack4edu-b7cfhhbtczb0gndq.westus3-01.azurewebsites.net/api/health';

          // Timeout con AbortController
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 100000); // 10s

          try {
            const res = await fetch(url, { method: 'GET', signal: controller.signal });

            clearTimeout(timeoutId);

            // Mostrar status y algunas cabeceras para depuración
            const info = {
              status: res.status,
              statusText: res.statusText,
              contentType: res.headers.get('content-type') || ''
            };

            if (!res.ok) {
              // intenta obtener cuerpo para ver mensaje de error del servidor
              let textBody = '';
              try {
                textBody = await res.text();
              } catch (e) {
                textBody = '<no se pudo leer el body de error>';
              }
              this.response = JSON.stringify({ info, body: textBody }, null, 2);
              this.error = `Respuesta no OK: ${res.status} ${res.statusText}`;
              return;
            }

            // Si es JSON, parsea; si no, devuelve texto
            const ct = res.headers.get('content-type') || '';
            if (ct.includes('application/json')) {
              const data = await res.json();
              this.response = JSON.stringify({ info, data }, null, 2);
            } else {
              const text = await res.text();
              this.response = JSON.stringify({ info, text }, null, 2);
            }
          } catch (err) {
            clearTimeout(timeoutId);

            // Mensajes comunes: abort (timeout), TypeError (CORS o red), etc.
            if (err.name === 'AbortError') {
              this.error = 'Error en el test fetch: tiempo de espera agotado (timeout).';
            } else if (err instanceof TypeError) {
              // TypeError suele indicar fallo de red o CORS cuando fetch no puede completar
              this.error = `Error en el test fetch: fallo de red o CORS — ${err.message}`;
              // para depuración avanzada puedes abrir la consola del navegador y mirar la pestaña Network
            } else {
              this.error = `Error en el test fetch: ${err.message}`;
            }

            // Opcional: mostrar stack en response para depuración local (puedes quitarlo después)
            this.response = (err && err.stack) ? String(err.stack) : '';
          }
        },


        reset() {
          this.file = null;
          this.response = '';
          this.error = '';
          this.uploading = false;
          this.uploadProgress = 0;
          // Limpiar el input de archivo
          const fileInput = document.querySelector('input[type="file"]');
          if (fileInput) fileInput.value = '';
        }
      }));
    });
  </script>
</body>
</html>
