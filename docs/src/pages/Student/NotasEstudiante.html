<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Alpine.js -->
    <script src="//unpkg.com/alpinejs" defer></script>

    <!-- Global Styles -->
    <link rel="stylesheet" href="../../styles/global.css">
    <link rel="stylesheet" href="../../styles/pages.css">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        mono: ['CaskaydiaMono', 'Courier New', 'monospace']
                    }
                }
            }
        }
    </script>
    
    <title>Mis Notas - Portal Estudiantil</title>
    
    <style>
        .grade-badge {
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            font-weight: 600;
            font-size: 1.125rem;
            display: inline-block;
            box-shadow: var(--shadow-sm);
        }
        
        .grade-excellent {
            background: linear-gradient(135deg, #8a9b7a, #6d8066);
            color: var(--color-text-primary);
        }
        
        .grade-good {
            background: linear-gradient(135deg, var(--color-coffee-accent), var(--color-coffee-medium));
            color: var(--color-text-primary);
        }
        
        .grade-regular {
            background: linear-gradient(135deg, var(--color-warning), var(--color-coffee-dark));
            color: var(--color-text-primary);
        }
        
        .grade-low {
            background: linear-gradient(135deg, var(--color-error), var(--color-coffee-dark));
            color: var(--color-text-primary);
        }
        
        .spinner {
            border: 4px solid var(--color-border-secondary);
            border-top: 4px solid var(--color-accent-primary);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .stat-card {
            background: linear-gradient(135deg, var(--color-bg-card), var(--color-bg-tertiary));
            border: 1px solid var(--color-border-secondary);
            border-radius: 1rem;
            padding: 1.5rem;
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            border-color: var(--color-accent-primary);
            box-shadow: var(--shadow-accent);
            transform: translateY(-2px);
        }

        .table-row {
            border-bottom: 1px solid var(--color-border-primary);
            transition: all 0.2s ease;
        }

        .table-row:hover {
            background-color: rgba(251, 187, 90, 0.05);
            border-left: 3px solid var(--color-accent-primary);
        }

        .student-header {
            background: linear-gradient(135deg, var(--color-bg-secondary), var(--color-bg-tertiary));
            border: 1px solid var(--color-coffee-dark);
            border-radius: 1rem;
            padding: 2rem;
            margin-bottom: 2rem;
        }
    </style>
</head>

<body class="font-mono min-h-screen p-4" style="background: linear-gradient(135deg, var(--color-bg-primary), var(--color-bg-secondary)); color: var(--color-text-primary);">
    
    <div x-data="gradesManager()" class="max-w-7xl mx-auto">
        <!-- Header del estudiante -->
        <div class="student-header fade-in mb-6">
            <div class="flex items-center justify-between flex-wrap gap-4">
                <div class="flex items-center gap-4">
                    <div class="accent-circle w-16 h-16 flex items-center justify-center">
                        <svg class="w-8 h-8 text-white" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd"></path>
                        </svg>
                    </div>
                    <div>
                        <h1 class="text-3xl font-bold" style="color: var(--color-text-primary);">Mis Notas</h1>
                        <p class="text-lg" style="color: var(--color-text-secondary);" x-text="studentName"></p>
                        <p class="text-sm" style="color: var(--color-text-muted);">ID: <span x-text="studentId"></span></p>
                    </div>
                </div>
                <button 
                    @click="window.location.href='Student.html'"
                    class="btn-secondary flex items-center gap-2"
                >
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                    </svg>
                    Regresar
                </button>
            </div>
        </div>

        <!-- Loading spinner -->
        <div x-show="loading" class="flex flex-col items-center justify-center py-16 fade-in">
            <div class="spinner"></div>
            <p class="mt-4 text-lg" style="color: var(--color-text-secondary);">Cargando tus notas...</p>
        </div>

        <!-- Error message -->
        <div x-show="error" class="alert alert-error fade-in mb-6">
            <svg class="w-6 h-6 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"></path>
            </svg>
            <div>
                <p class="font-semibold">Error al cargar las notas</p>
                <p class="text-sm" x-text="error"></p>
            </div>
            <button @click="loadGrades()" class="btn-secondary ml-auto">Reintentar</button>
        </div>

        <!-- Estadísticas -->
        <div x-show="!loading && !error && grades.length > 0" class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6 slide-in-up">
            <div class="stat-card">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm" style="color: var(--color-text-secondary);">Promedio General</p>
                        <p class="text-3xl font-bold mt-1" 
                           :style="'color: ' + getGradeColor(averageGrade)" 
                           x-text="averageGrade.toFixed(2)">
                        </p>
                    </div>
                    <div class="accent-circle w-14 h-14 flex items-center justify-center">
                        <svg class="w-7 h-7 text-white" fill="currentColor" viewBox="0 0 20 20">
                            <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path>
                        </svg>
                    </div>
                </div>
                <div class="mt-3">
                    <span class="text-xs px-2 py-1 rounded" 
                          :style="'background-color: ' + getGradeColor(averageGrade) + '20; color: ' + getGradeColor(averageGrade)"
                          x-text="getGradeLabel(averageGrade)">
                    </span>
                </div>
            </div>

            <div class="stat-card">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm" style="color: var(--color-text-secondary);">Total Actividades</p>
                        <p class="text-3xl font-bold mt-1" style="color: var(--color-accent-primary);" x-text="grades.length"></p>
                    </div>
                    <div style="background: linear-gradient(135deg, var(--color-coffee-medium), var(--color-coffee-dark));" class="w-14 h-14 rounded-full flex items-center justify-center">
                        <svg class="w-7 h-7 text-white" fill="currentColor" viewBox="0 0 20 20">
                            <path d="M9 2a1 1 0 000 2h2a1 1 0 100-2H9z"></path>
                            <path fill-rule="evenodd" d="M4 5a2 2 0 012-2 3 3 0 003 3h2a3 3 0 003-3 2 2 0 012 2v11a2 2 0 01-2 2H6a2 2 0 01-2-2V5zm3 4a1 1 0 000 2h.01a1 1 0 100-2H7zm3 0a1 1 0 000 2h3a1 1 0 100-2h-3zm-3 4a1 1 0 100 2h.01a1 1 0 100-2H7zm3 0a1 1 0 100 2h3a1 1 0 100-2h-3z" clip-rule="evenodd"></path>
                        </svg>
                    </div>
                </div>
            </div>

            <div class="stat-card">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm" style="color: var(--color-text-secondary);">Nota Más Alta</p>
                        <p class="text-3xl font-bold mt-1" style="color: var(--color-success);" x-text="highestGrade.toFixed(2)"></p>
                    </div>
                    <div style="background: linear-gradient(135deg, #8a9b7a, #6d8066);" class="w-14 h-14 rounded-full flex items-center justify-center">
                        <svg class="w-7 h-7 text-white" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M12 7a1 1 0 110-2h5a1 1 0 011 1v5a1 1 0 11-2 0V8.414l-4.293 4.293a1 1 0 01-1.414 0L8 10.414l-4.293 4.293a1 1 0 01-1.414-1.414l5-5a1 1 0 011.414 0L11 10.586 14.586 7H12z" clip-rule="evenodd"></path>
                        </svg>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tabla de notas -->
        <div x-show="!loading && !error && grades.length > 0" class="container-box overflow-hidden fade-in" style="border: 1px solid var(--color-border-coffee);">
            <div class="overflow-x-auto">
                <table class="w-full">
                    <thead>
                        <tr class="table-header-coffee">
                            <th class="px-6 py-4 text-left font-bold">Taller</th>
                            <th class="px-6 py-4 text-center font-bold">Nota</th>
                            <th class="px-6 py-4 text-center font-bold">Estado</th>
                            <th class="px-6 py-4 text-left font-bold">Comentarios</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template x-for="(grade, index) in grades" :key="grade.RowKey || index">
                            <tr class="table-row" x-data="{ showComments: false }">
                                <td class="px-6 py-4">
                                    <div class="flex items-center gap-3">
                                        <div style="background: linear-gradient(135deg, var(--color-accent-primary), var(--color-accent-secondary));" class="w-10 h-10 rounded-lg flex items-center justify-center flex-shrink-0">
                                            <span class="text-white font-bold" x-text="index + 1"></span>
                                        </div>
                                        <div>
                                            <p class="font-semibold" style="color: var(--color-text-primary);" x-text="grade.RowKey || 'Taller ' + (index + 1)"></p>
                                            <p class="text-sm" style="color: var(--color-text-muted);">Actividad #<span x-text="index + 1"></span></p>
                                        </div>
                                    </div>
                                </td>
                                <td class="px-6 py-4 text-center">
                                    <span class="grade-badge" 
                                          :class="getGradeBadgeClass(grade.Score)"
                                          x-text="grade.Score.toFixed(1)">
                                    </span>
                                </td>
                                <td class="px-6 py-4 text-center">
                                    <span class="badge" 
                                          :style="'background-color: ' + getGradeColor(grade.Score) + '20; color: ' + getGradeColor(grade.Score) + '; border-color: ' + getGradeColor(grade.Score)"
                                          x-text="getGradeLabel(grade.Score)">
                                    </span>
                                </td>
                                <td class="px-6 py-4">
                                    <div>
                                        <button 
                                            @click="showComments = !showComments"
                                            class="flex items-center gap-2 text-sm transition-colors"
                                            style="color: var(--color-accent-primary);"
                                            x-show="grade.Comments"
                                        >
                                            <svg class="w-5 h-5 transition-transform" :class="showComments ? 'rotate-180' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                                            </svg>
                                            <span x-text="showComments ? 'Ocultar' : 'Ver comentarios'"></span>
                                        </button>
                                        <p 
                                            x-show="!grade.Comments" 
                                            class="text-sm italic" 
                                            style="color: var(--color-text-muted);"
                                        >
                                            Sin comentarios
                                        </p>
                                        <div 
                                            x-show="showComments && grade.Comments" 
                                            x-transition
                                            class="mt-3 p-3 rounded-lg" 
                                            style="background-color: var(--color-bg-tertiary); border-left: 3px solid var(--color-accent-primary);"
                                        >
                                            <p class="text-sm" style="color: var(--color-text-secondary);" x-text="grade.Comments"></p>
                                        </div>
                                    </div>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Empty state -->
        <div x-show="!loading && !error && grades.length === 0" class="container-box p-12 text-center fade-in">
            <svg class="w-24 h-24 mx-auto mb-4" style="color: var(--color-text-muted);" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
            </svg>
            <h3 class="text-xl font-semibold mb-2" style="color: var(--color-text-primary);">No hay notas disponibles</h3>
            <p style="color: var(--color-text-secondary);">Aún no tienes calificaciones registradas.</p>
        </div>
    </div>

    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('gradesManager', () => ({
                loading: false,
                error: '',
                grades: [],
                studentName: '',
                studentId: '',
                averageGrade: 0,
                highestGrade: 0,

                init() {
                    // Obtener información del estudiante desde localStorage
                    try {
                        const session = localStorage.getItem('studentSession');
                        if (!session) {
                            window.location.href = 'Student.html';
                            return;
                        }
                        const sessionData = JSON.parse(session);
                        this.studentName = sessionData.studentName || 'Estudiante';
                        this.studentId = sessionData.studentCode || '000000';
                    } catch (e) {
                        console.error('Error al obtener sesión:', e);
                        window.location.href = 'Student.html';
                        return;
                    }

                    this.loadGrades();
                },

                async loadGrades() {
                    this.loading = true;
                    this.error = '';
                    this.grades = [];

                    const URL = 'https://fahack4edu-b7cfhhbtczb0gndq.westus3-01.azurewebsites.net/api/getGradeStudent';

                    try {
                        const formData = new FormData();
                        formData.append('student_id', this.studentId);

                        const controller = new AbortController();
                        const timeoutId = setTimeout(() => controller.abort(), 30000);

                        const res = await fetch(URL, {
                            method: 'POST',
                            body: formData,
                            signal: controller.signal
                        });

                        clearTimeout(timeoutId);

                        if (!res.ok) {
                            throw new Error(`Error del servidor: ${res.status} ${res.statusText}`);
                        }

                        const data = await res.json();
                        console.log('Datos recibidos:', data);
                        
                        // El JSON retorna: {"student_id": "333333", "grade": [{...}]}
                        if (data && data.grade && Array.isArray(data.grade)) {
                            // Actualizar nombre del estudiante si viene en los datos
                            if (data.grade.length > 0 && data.grade[0].Name) {
                                this.studentName = data.grade[0].Name;
                            }
                            
                            this.grades = data.grade;
                            this.calculateStatistics();
                        } else if (data.message || data.error) {
                            // Si el servidor devuelve un mensaje de error
                            this.error = data.message || data.error || 'No se encontraron calificaciones';
                            this.grades = [];
                        } else {
                            this.grades = [];
                        }

                    } catch (error) {
                        if (error.name === 'AbortError') {
                            this.error = 'La solicitud tardó demasiado. Por favor, intenta de nuevo.';
                        } else {
                            this.error = error.message || 'Error al cargar las notas';
                        }
                        console.error('Error:', error);
                    } finally {
                        this.loading = false;
                    }
                },

                calculateStatistics() {
                    if (this.grades.length === 0) {
                        this.averageGrade = 0;
                        this.highestGrade = 0;
                        return;
                    }

                    const sum = this.grades.reduce((acc, grade) => acc + grade.Score, 0);
                    this.averageGrade = sum / this.grades.length;
                    this.highestGrade = Math.max(...this.grades.map(g => g.Score));
                },

                getGradeColor(grade) {
                    if (grade >= 4.5) return '#8a9b7a'; // Verde para excelente
                    if (grade >= 3.5) return '#d4a574'; // Café claro para bueno
                    if (grade >= 2.5) return '#e3b063'; // Amarillo para regular
                    return '#a56b6b'; // Rojo para bajo
                },

                getGradeLabel(grade) {
                    if (grade >= 4.5) return 'Excelente';
                    if (grade >= 3.5) return 'Bueno';
                    if (grade >= 2.5) return 'Regular';
                    return 'Necesita Mejorar';
                },

                getGradeBadgeClass(grade) {
                    if (grade >= 4.5) return 'grade-excellent';
                    if (grade >= 3.5) return 'grade-good';
                    if (grade >= 2.5) return 'grade-regular';
                    return 'grade-low';
                }
            }));
        });
    </script>
</body>
</html>
