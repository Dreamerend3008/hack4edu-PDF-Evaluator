<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDFSSOR | Evaluador Inteligente</title>
  <link rel="stylesheet" href="../../styles/global.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            mono: ['CaskaydiaMono', 'Courier New', 'monospace']
          }
        }
      }
    }
  </script>
  <style>
    .gradient-text {
      background: linear-gradient(135deg, var(--color-accent-primary), var(--color-accent-secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .gradient-navbar {
      background: linear-gradient(135deg, rgba(29, 46, 51, 0.95), rgba(27, 40, 49, 0.95));
      border-bottom: 2px solid transparent;
      border-image: linear-gradient(90deg, var(--color-accent-primary), var(--color-accent-secondary)) 1;
    }

    .logo-gradient {
      background: linear-gradient(135deg, var(--color-accent-primary) 0%, var(--color-coffee-medium) 50%, var(--color-accent-secondary) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-weight: 900;
      letter-spacing: -0.5px;
    }
  </style>
</head>
<body class="font-mono flex flex-col min-h-screen">

  <!-- NAVBAR -->
  <nav class="gradient-navbar flex justify-between items-center px-8 py-4 backdrop-blur-md shadow-lg">
    <h1 class="text-2xl logo-gradient">PDFSSOR</h1>
    <div class="space-x-6 text-secondary">
      <a href="Home.html" class="hover:text-accent transition text-accent font-semibold">Inicio</a>
      <a href="Acerca.html" class="hover:text-accent transition">Acerca</a>
      <a href="Equipo.html" class="hover:text-accent transition">Equipo</a>
    </div>
  </nav>

  <!-- HERO SECTION -->
  <main class="flex flex-col lg:flex-row items-center justify-center flex-grow px-8 py-16 lg:py-0 gap-12 text-center lg:text-left">

    <!-- Texto principal -->
    <div class="max-w-lg space-y-6 fade-in">
      <h2 class="text-5xl font-extrabold leading-tight">
        Evaluaciones inteligentes con <span class="gradient-text">PDFSSOR</span>
      </h2>
      <p class="text-muted text-lg">
        Plataforma basada en inteligencia artificial que permite a los docentes publicar sus rúbricas,
        evaluar automáticamente evidencias en PDF y ofrecer retroalimentación inmediata y objetiva.
      </p>

      <div class="flex flex-col sm:flex-row gap-4 justify-center lg:justify-start">
        <a href="../Student/Student.html">
          <button class="btn-primary">
            Ingreso Alumnos
          </button>
        </a>
        <a href="../Teacher/TeacherHome.html">
          <button class="btn-primary">
            Ingreso Docentes
          </button>
        </a>
      </div>
    </div>

    <!-- Imagen / ícono a la derecha -->
    <div class="relative flex flex-col items-center justify-center slide-in-right">
      <span class="text-9xl font-extrabold logo-gradient" style="color: #fbbb5a;">PDF</span>
      <span class="text-8xl font-extrabold logo-gradient" style="color: #7a9ee8; margin-top: -10px;">SSOR</span>
      <div class="mt-4 h-2 w-48 rounded-full" 
          style="background: linear-gradient(90deg, var(--color-accent-primary), var(--color-accent-secondary));">
      </div>
    </div>


  </main>

  <!-- PIE -->
  <footer class="text-center text-muted text-sm py-4 border-t" style="border-color: var(--color-border-primary);">
    Proyecto Hack4Edu 2025
  </footer>

</body>
</html>
