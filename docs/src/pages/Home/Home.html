<!DOCTYPE html>
<html lang="es">
<head>

  <title>PDFSSOR | Evaluador Inteligente</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>

      font-family: 'CaskaydiaMono';
      src: url('../../../public/fonts/CaskaydiaMonoNerdFontMono-Regular.ttf') format('truetype');

      font-style: normal;

    body {

    }

    .btn {
      transition: transform 0.2s ease, background 0.3s ease;
    }
    .btn:hover {
      transform: scale(1.05);
    }

<body class="flex flex-col min-h-screen">

  <!-- NAVBAR -->
  <nav class="flex justify-between items-center px-8 py-4 bg-[#1d2e33]/80 backdrop-blur-md shadow-lg">

    <div class="space-x-6 text-gray-300">

  </nav>

  <main class="flex flex-col lg:flex-row items-center justify-center flex-grow px-8 py-16 lg:py-0 gap-12 text-center lg:text-left">

    <div class="max-w-lg space-y-6 fade-in">

      <div class="flex flex-col sm:flex-row gap-4 justify-center lg:justify-start">

    </div>

    <!-- Imagen / ícono a la derecha -->
    <div class="relative flex flex-col items-center justify-center">
      
        <span class="text-9xl font-extrabold" style="color: #fbbb5a;">PDF</span>

    Proyecto Hack4Edu 2025
