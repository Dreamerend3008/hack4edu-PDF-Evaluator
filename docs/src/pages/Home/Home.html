<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDFSSOR | Evaluador Inteligente</title>
  <link rel="stylesheet" href="../../styles/global.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            mono: ['CaskaydiaMono', 'Courier New', 'monospace']
          }
        }
      }
    }
  </script>
</head>
<body class="font-mono flex flex-col min-h-screen">

  <!-- NAVBAR -->
  <nav class="flex justify-between items-center px-8 py-4 backdrop-blur-md shadow-lg" style="background-color: rgba(29, 46, 51, 0.8);">
    <h1 class="text-2xl font-bold text-accent">PDF<span class="text-2xl font-extrabold" style="color: var(--color-accent-secondary);">SSOR</span></h1>
    <div class="space-x-6 text-secondary">
      <a href="#" class="hover:text-accent transition">Inicio</a>
      <a href="#" class="hover:text-accent transition">Acerca</a>
      <a href="#" class="hover:text-accent transition">Equipo</a>
    </div>
  </nav>

  <!-- HERO SECTION -->
  <main class="flex flex-col lg:flex-row items-center justify-center flex-grow px-8 py-16 lg:py-0 gap-12 text-center lg:text-left">

    <!-- Texto principal -->
    <div class="max-w-lg space-y-6 fade-in">
      <h2 class="text-5xl font-extrabold leading-tight">
        Evaluaciones inteligentes con <span class="text-accent">PDF<span class="text-5xl font-extrabold" style="color: var(--color-accent-secondary);">SSOR</span></span>
      </h2>
      <p class="text-muted text-lg">
        Plataforma basada en inteligencia artificial que permite a los docentes publicar sus rúbricas,
        evaluar automáticamente evidencias en PDF y ofrecer retroalimentación inmediata y objetiva.
      </p>

      <div class="flex flex-col sm:flex-row gap-4 justify-center lg:justify-start">
        <a href="../Student/Student.html">
          <button class="btn-primary">
            Ingreso Alumnos
          </button>
        </a>
        <a href="../Teacher/TeacherHome.html">
          <button class="btn-primary">
            Ingreso Docentes
          </button>
        </a>
      </div>
    </div>

    <!-- Imagen / ícono a la derecha -->
    <div class="relative flex flex-col items-center justify-center slide-in-right">
      <span class="text-9xl font-extrabold text-accent">PDF</span>
      <span class="text-8xl font-extrabold" style="color: var(--color-accent-secondary);">SSOR</span>
    </div>

  </main>

  <!-- PIE -->
  <footer class="text-center text-muted text-sm py-4 border-t" style="border-color: var(--color-border-primary);">
    Proyecto Hack4Edu 2025
  </footer>

</body>
</html>
