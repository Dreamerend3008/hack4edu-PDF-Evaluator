<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Health Check - API</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Alpine.js -->
  <script src="//unpkg.com/alpinejs" defer></script>
  
  <style>
    @font-face {
      font-family: 'CaskaydiaMono';
      src: url('../../../public/fonts/CaskaydiaMonoNerdFontMono-Regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
    }
    
    body {
      font-family: 'CaskaydiaMono', monospace;
      background-color: #20232a;
    }
    
    .fade-in {
      animation: fadeIn 0.5s ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .container-box {
      background-color: #1d2e33;
      border-radius: 1rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    
    .btn-check {
      background: linear-gradient(135deg, #638ce3 0%, #1d6489 100%);
      color: #d5d2c9;
      padding: 0.75rem 2rem;
      border-radius: 0.5rem;
      font-weight: 600;
      transition: all 0.3s;
      border: none;
      cursor: pointer;
    }
    
    .btn-check:hover {
      transform: scale(1.05);
      box-shadow: 0 5px 15px rgba(99, 140, 227, 0.4);
    }
    
    .btn-back {
      background-color: #1b3847;
      color: #d5d2c9;
      padding: 0.75rem 2rem;
      border-radius: 0.5rem;
      font-weight: 600;
      transition: all 0.3s;
      border: 2px solid #1d6489;
      cursor: pointer;
    }
    
    .btn-back:hover {
      border-color: #326342;
      transform: scale(1.05);
    }
  </style>
</head>
<body class="font-mono min-h-screen flex flex-col items-center justify-center p-4" style="background-color: #20232a; color: #d5d2c9;">
  
  <div x-data="healthCheck()" class="max-w-3xl w-full">
    <!-- Header -->
    <div class="text-center mb-8 fade-in">
      <h1 class="text-3xl font-bold mb-2" style="color: #d5d2c9;">Health Check API</h1>
      <p style="color: #d5d2c9; opacity: 0.8;">Verifica el estado del servidor backend</p>
    </div>

    <!-- Contenedor principal -->
    <div class="container-box p-8 fade-in" style="border: 1px solid #1d6489;">
      <!-- Información del endpoint -->
      <div class="mb-6 p-4 rounded-lg" style="background-color: #1b3847;">
        <h2 class="text-sm font-semibold mb-2" style="color: #638ce3;">Endpoint:</h2>
        <code class="text-xs" style="color: #d5d2c9; opacity: 0.9;">Harry un cruasan porfa</code>
      </div>

      <!-- Botón de verificación -->
      <div class="text-center mb-6">
        <button
          @click="testFetch"
          :disabled="loading"
          :class="loading ? 'opacity-50 cursor-not-allowed' : ''"
          class="btn-check px-8 py-3 rounded-lg text-lg font-semibold transition-all duration-300 flex items-center justify-center mx-auto"
        >
          <span x-show="!loading" class="flex items-center">
            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            Verificar Estado
          </span>
          <span x-show="loading" class="flex items-center">
            <svg class="animate-spin -ml-1 mr-3 h-5 w-5" style="color: #d5d2c9;" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            Verificando...
          </span>
        </button>
      </div>

      <!-- Estado del servidor -->
      <div x-show="status" class="mb-6">
        <div class="p-4 rounded-lg flex items-center" :style="statusOk ? 'background-color: rgba(50, 99, 66, 0.3); border: 1px solid #326342;' : 'background-color: rgba(91, 0, 9, 0.5); border: 1px solid #5b0009;'">
          <svg x-show="statusOk" class="w-6 h-6 mr-3" style="color: #326342;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
          </svg>
          <svg x-show="!statusOk" class="w-6 h-6 mr-3" style="color: #e3b063;" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"></path>
          </svg>
          <div>
            <p class="font-semibold" :style="statusOk ? 'color: #326342;' : 'color: #e3b063;'" x-text="status"></p>
            <p class="text-sm" style="color: #d5d2c9; opacity: 0.8;" x-text="statusMessage"></p>
          </div>
        </div>
      </div>

      <!-- Resultados -->
      <div x-show="response" class="mb-6">
        <h3 class="text-lg font-semibold mb-3" style="color: #d5d2c9;">Respuesta del servidor:</h3>
        <div class="rounded-lg p-4 max-h-96 overflow-y-auto" style="background-color: #1b3847; border: 1px solid #1d6489;">
          <pre class="text-sm whitespace-pre-wrap" style="color: #d5d2c9;" x-text="response"></pre>
        </div>
      </div>

      <!-- Mensaje de error -->
      <div x-show="error" class="mb-6 p-3 rounded-lg flex items-start" style="background-color: rgba(91, 0, 9, 0.5); border: 1px solid #5b0009;">
        <svg class="w-5 h-5 mt-0.5 mr-2 flex-shrink-0" style="color: #e3b063;" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"></path>
        </svg>
        <span class="text-sm" style="color: #e3b063;" x-text="error"></span>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('alpine:init', () => {
      Alpine.data('healthCheck', () => ({
        loading: false,
        response: '',
        error: '',
        status: '',
        statusMessage: '',
        statusOk: false,

        async testFetch() {
          this.loading = true;
          this.response = '';
          this.error = '';
          this.status = '';
          this.statusMessage = '';

          const URL = 'https://fahack4edu-b7cfhhbtczb0gndq.westus3-01.azurewebsites.net/api/health';

          try {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 10000); // 10 segundos timeout

            const res = await fetch(URL, {
              method: 'GET',
              signal: controller.signal
            });

            clearTimeout(timeoutId);

            const info = {
              url: URL,
              status: res.status,
              statusText: res.statusText,
              contentType: res.headers.get('content-type') || ''
            };

            if (!res.ok) {
              let textBody = '';
              try {
                textBody = await res.text();
              } catch (e) {
                textBody = '<no se pudo leer el body de error>';
              }
              this.response = JSON.stringify({ info, body: textBody }, null, 2);
              this.status = '❌ Servidor no disponible';
              this.statusMessage = `${res.status} ${res.statusText}`;
              this.statusOk = false;
              return;
            }

            // Si es JSON, parsea; si no, devuelve texto
            const ct = res.headers.get('content-type') || '';
            if (ct.includes('application/json')) {
              const data = await res.json();
              this.response = JSON.stringify({ info, data }, null, 2);
              this.status = '✅ Servidor operativo';
              this.statusMessage = 'La API está funcionando correctamente';
              this.statusOk = true;
            } else {
              const text = await res.text();
              this.response = JSON.stringify({ info, text }, null, 2);
              this.status = '✅ Servidor operativo';
              this.statusMessage = 'Respuesta recibida del servidor';
              this.statusOk = true;
            }

          } catch (error) {
            this.error = `Error de conexión: ${error.message}`;
            this.status = '❌ Error de conexión';
            this.statusMessage = 'No se pudo conectar con el servidor';
            this.statusOk = false;
          } finally {
            this.loading = false;
          }
        }
      }));
    });
  </script>
</body>
</html>
